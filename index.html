<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #111;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #eee;
          background: #121212;
        }
        input[type="text"] {
          background: #1e1e1e;
          color: inherit;
          border-color: #444;
        }
      }
      body {
        margin: 0;
        padding: 1rem;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 1rem;
      }
      form p {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin: 0 0 1rem;
      }
      label {
        flex: 1 1 100%;
        font-size: 0.875rem;
      }
      input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0.375rem 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      li label {
        flex: 1;
        cursor: pointer;
      }
      li[data-done="true"] label {
        text-decoration: line-through;
        opacity: 0.65;
      }
      #empty {
        font-size: 0.875rem;
        opacity: 0.7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <form id="add-form">
        <p>
          <label for="new-text">New task</label>
          <input
            id="new-text"
            name="text"
            type="text"
            autocomplete="off"
            maxlength="500"
            required
            placeholder="e.g. Buy milk"
          />
          <button type="submit">Add</button>
        </p>
      </form>
      <ul id="todo-list" aria-label="Tasks"></ul>
      <p id="empty" hidden>No tasks yet. Add one above.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
