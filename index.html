<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF4EE" />
    <title>Surprise &amp; Delight · Today's little wins</title>

    <link rel="icon" type="image/svg+xml" href="/emoji-favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <!-- Soft decorative blobs -->
    <div class="bg-deco" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>

    <main class="app">
      <!-- ─── Brand header ─────────────────────────────── -->
      <header class="brand">
        <div class="brand__mark" aria-hidden="true">
          <!-- Smiling cookie logo -->
          <svg viewBox="0 0 64 64" width="56" height="56" class="logo-cookie">
            <defs>
              <radialGradient id="cookieG" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#F4D2A8" />
                <stop offset="100%" stop-color="#D8A269" />
              </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="26" fill="url(#cookieG)" stroke="#6B4E3D" stroke-width="2.5" />
            <!-- chocolate chips (scattered around the face) -->
            <circle cx="20" cy="22" r="2.4" fill="#5A3A2A" />
            <circle cx="46" cy="20" r="2.2" fill="#5A3A2A" />
            <circle cx="48" cy="34" r="2.4" fill="#5A3A2A" />
            <circle cx="16" cy="34" r="2.2" fill="#5A3A2A" />
            <circle cx="22" cy="48" r="2.4" fill="#5A3A2A" />
            <circle cx="42" cy="48" r="2.2" fill="#5A3A2A" />
            <!-- face: two closed/happy eyes -->
            <path d="M24 30q2 2 4 0" stroke="#5A3A2A" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M36 30q2 2 4 0" stroke="#5A3A2A" stroke-width="2" stroke-linecap="round" fill="none"/>
            <!-- smile -->
            <path d="M28 38q4 3 8 0" stroke="#5A3A2A" stroke-width="2" stroke-linecap="round" fill="none"/>
            <!-- cheeks -->
            <circle cx="22" cy="36" r="2" fill="#F7A6C1" opacity=".8"/>
            <circle cx="42" cy="36" r="2" fill="#F7A6C1" opacity=".8"/>
            <!-- sparkles -->
            <path d="M8 14l2 2 2-2-2-2zM58 50l2 2 2-2-2-2z" fill="#F7A6C1"/>
          </svg>
        </div>
        <div class="brand__text">
          <p class="brand__eyebrow">today's little wins</p>
          <h1 class="brand__wordmark">surprise &amp; delight</h1>
          <p class="brand__date" id="brand-date"></p>
        </div>
      </header>

      <!-- ─── Progress card ────────────────────────────── -->
      <section class="progress-card" aria-label="Progress">
        <div class="progress-card__row">
          <div>
            <p class="progress-card__label" id="progress-label">no tasks yet</p>
            <p class="progress-card__sub" id="progress-sub">add your first sweet little win</p>
          </div>
          <div class="progress-card__ring" aria-hidden="true">
            <svg viewBox="0 0 60 60" width="60" height="60">
              <circle cx="30" cy="30" r="25" stroke="#FFD6E3" stroke-width="6" fill="none"/>
              <circle id="progress-ring" cx="30" cy="30" r="25" stroke="#F7A6C1" stroke-width="6"
                fill="none" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"
                transform="rotate(-90 30 30)"/>
            </svg>
            <span class="progress-card__pct" id="progress-pct">0%</span>
          </div>
        </div>
      </section>

      <!-- ─── Quick add ────────────────────────────────── -->
      <section class="add-card">
        <form id="add-form" autocomplete="off">
          <label for="new-text" class="visually-hidden">New task</label>
          <div class="add-card__row">
            <input
              id="new-text"
              name="text"
              type="text"
              maxlength="500"
              required
              placeholder="what sweet thing's on your list?"
            />
            <button type="submit" class="btn btn--primary" aria-label="Add task">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <span>add</span>
            </button>
          </div>

          <fieldset class="tags" aria-label="Optional tag">
            <legend class="visually-hidden">Optional tag</legend>
            <input type="radio" name="tag" id="tag-none" value="" checked />
            <label for="tag-none" class="tag tag--none">no tag</label>

            <input type="radio" name="tag" id="tag-heart" value="heart" />
            <label for="tag-heart" class="tag tag--heart" title="love this one">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="currentColor"/></svg>
              love
            </label>

            <input type="radio" name="tag" id="tag-sip" value="sip" />
            <label for="tag-sip" class="tag tag--sip" title="quick sip — under 5 min">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9zm11 1h2a2 2 0 0 1 0 4h-2M8 4c0 1 1 1 1 2M11 4c0 1 1 1 1 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              sip
            </label>

            <input type="radio" name="tag" id="tag-treat" value="treat" />
            <label for="tag-treat" class="tag tag--treat" title="a little treat for you">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="9" cy="10" r="1.2" fill="#fff"/><circle cx="14" cy="13" r="1.2" fill="#fff"/><circle cx="11" cy="15" r="1" fill="#fff"/></svg>
              treat
            </label>

            <input type="radio" name="tag" id="tag-slice" value="slice" />
            <label for="tag-slice" class="tag tag--slice" title="big slice — bigger task">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 18l9-12 9 12z" fill="currentColor"/><path d="M3 18h18" stroke="#fff" stroke-width="2"/></svg>
              slice
            </label>
          </fieldset>
        </form>
      </section>

      <!-- ─── Toolbar (search + filters) ───────────────── -->
      <section class="toolbar" aria-label="Filters">
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="search tasks…  (press /)" aria-label="Search tasks" />
        </div>

        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter is-active" data-filter="all" role="tab" aria-selected="true">
            all <span class="count" id="count-all">0</span>
          </button>
          <button class="filter" data-filter="active" role="tab" aria-selected="false">
            active <span class="count" id="count-active">0</span>
          </button>
          <button class="filter" data-filter="done" role="tab" aria-selected="false">
            done <span class="count" id="count-done">0</span>
          </button>
        </div>

        <button id="clear-done" class="btn btn--ghost" type="button" hidden>
          clear done
        </button>
      </section>

      <!-- ─── List ─────────────────────────────────────── -->
      <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>

      <!-- ─── Empty state ──────────────────────────────── -->
      <section id="empty" class="empty" hidden>
        <svg viewBox="0 0 200 140" width="180" height="120" aria-hidden="true">
          <ellipse cx="100" cy="120" rx="70" ry="6" fill="#FFD6E3" opacity=".5"/>
          <!-- Mug -->
          <path d="M55 50h70v40a25 25 0 0 1-25 25H80a25 25 0 0 1-25-25V50z" fill="#FFE7D6" stroke="#6B4E3D" stroke-width="3"/>
          <path d="M125 60h10a12 12 0 0 1 0 24h-10" fill="none" stroke="#6B4E3D" stroke-width="3"/>
          <ellipse cx="90" cy="50" rx="35" ry="6" fill="#F7A6C1"/>
          <!-- Steam hearts -->
          <path d="M70 30c0-5 7-5 7 0 0 4-7 8-7 8s-7-4-7-8c0-5 7-5 7 0z" fill="#F7A6C1"/>
          <path d="M100 20c0-5 7-5 7 0 0 4-7 8-7 8s-7-4-7-8c0-5 7-5 7 0z" fill="#FFD6E3"/>
          <!-- Face -->
          <circle cx="80" cy="80" r="2" fill="#6B4E3D"/>
          <circle cx="100" cy="80" r="2" fill="#6B4E3D"/>
          <path d="M80 90q10 8 20 0" stroke="#6B4E3D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="72" cy="86" r="3" fill="#F7A6C1" opacity=".7"/>
          <circle cx="108" cy="86" r="3" fill="#F7A6C1" opacity=".7"/>
        </svg>
        <h2 id="empty-title">your list is fresh and warm</h2>
        <p id="empty-sub">start with something delicious — even small wins count.</p>
      </section>

      <!-- ─── Footer ───────────────────────────────────── -->
      <footer class="footer">
        <svg class="footer__scallop" viewBox="0 0 1200 30" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,30 Q30,0 60,30 T120,30 T180,30 T240,30 T300,30 T360,30 T420,30 T480,30 T540,30 T600,30 T660,30 T720,30 T780,30 T840,30 T900,30 T960,30 T1020,30 T1080,30 T1140,30 T1200,30 V30 H0 Z" fill="#F7A6C1"/>
        </svg>
        <p class="footer__tag">good coffee. sweet surprises. made for you. <span aria-hidden="true">♡</span></p>
      </footer>
    </main>

    <!-- Toast for undo -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text">task removed</span>
      <button id="toast-undo" type="button" class="btn btn--link">undo</button>
    </div>

    <!-- Hidden template for a todo item -->
    <template id="tpl-todo">
      <li class="todo">
        <button class="todo__check" type="button" aria-pressed="false" aria-label="Mark done">
          <svg viewBox="0 0 24 24" width="18" height="18" class="todo__heart" aria-hidden="true">
            <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="todo__body">
          <p class="todo__text"></p>
          <input class="todo__edit" type="text" maxlength="500" hidden />
          <span class="todo__tag" hidden></span>
        </div>
        <div class="todo__actions">
          <button class="icon-btn todo__edit-btn" type="button" aria-label="Edit task" title="Edit">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn todo__del-btn" type="button" aria-label="Remove task" title="Remove">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 7h14M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </li>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
